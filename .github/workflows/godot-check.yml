name: Godot project check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  headless-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget zip xvfb imagemagick xdotool wmctrl
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Check project files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
      - name: Import and parse project in headless mode
        run: Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Launch main scene for 120 frames
        run: Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 120
      - name: Capture actual game window screenshot
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          export LIBGL_ALWAYS_SOFTWARE=1
          export GODOT_SILENCE_ROOT_WARNING=1
          xvfb-run -a -s "-screen 0 1280x720x24" sh -c '
            set -eu
            Godot_v4.3-stable_linux.x86_64 --path . --rendering-method gl_compatibility --display-driver x11 --resolution 1280x720 --windowed >/tmp/nightbound-godot.log 2>&1 &
            game_pid=$!
            window_id=""
            for i in $(seq 1 40); do
              window_id=$(xdotool search --onlyvisible --class Godot 2>/dev/null | tail -n 1 || true)
              if [ -n "$window_id" ]; then break; fi
              sleep 1
            done
            if [ -z "$window_id" ]; then
              cat /tmp/nightbound-godot.log
              kill "$game_pid" 2>/dev/null || true
              exit 1
            fi
            xdotool windowmap "$window_id" || true
            xdotool windowactivate --sync "$window_id" || true
            sleep 3
            import -window root -crop 1280x720+0+0 "$RUNNER_TEMP/Nightbound-gameplay.png"
            identify "$RUNNER_TEMP/Nightbound-gameplay.png"
            kill "$game_pid" 2>/dev/null || true
            wait "$game_pid" 2>/dev/null || true
          '
          test -s "$RUNNER_TEMP/Nightbound-gameplay.png"
          test "$(identify -format '%wx%h' "$RUNNER_TEMP/Nightbound-gameplay.png")" = "1280x720"
      - name: Upload gameplay screenshot
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Nightbound-gameplay-screenshot
          path: ${{ runner.temp }}/Nightbound-gameplay.png
          if-no-files-found: error
          retention-days: 30
      - name: Package Nightbound source
        if: github.event_name != 'pull_request'
        run: |
          zip -r "$RUNNER_TEMP/Nightbound-main.zip" . \
            -x "./.git/*" "./.godot/*" ".git/*" ".godot/*"
          unzip -l "$RUNNER_TEMP/Nightbound-main.zip"
      - name: Upload Nightbound ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Nightbound-main
          path: ${{ runner.temp }}/Nightbound-main.zip
          if-no-files-found: error
          retention-days: 30
