name: Godot project check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  headless-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget zip xvfb imagemagick xdotool wmctrl
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Check project files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
      - name: Import and parse project in headless mode
        run: |
          set -o pipefail
          Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee /tmp/nightbound-import.log
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script|ERROR: Can.t add child|ERROR: Invalid assignment|ERROR: Parameter" /tmp/nightbound-import.log; then
            echo "Godot import emitted a script parse/load error."
            exit 1
          fi
      - name: Launch main scene for 120 frames
        run: |
          set -o pipefail
          Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 120 2>&1 | tee /tmp/nightbound-headless.log
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load script|ERROR: Can.t add child|ERROR: Invalid assignment" /tmp/nightbound-headless.log; then
            echo "The main scene emitted a script/runtime error."
            exit 1
          fi
          if ! grep -q "NIGHTBOUND_SCENE_READY" /tmp/nightbound-headless.log; then
            echo "The main scene did not signal that world generation finished."
            exit 1
          fi
      - name: Capture actual game window screenshot
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          export LIBGL_ALWAYS_SOFTWARE=1
          export GODOT_SILENCE_ROOT_WARNING=1
          xvfb-run -a -s "-screen 0 1280x720x24" sh -c '
            set -eu
            Godot_v4.3-stable_linux.x86_64 --verbose --path . --rendering-method gl_compatibility --display-driver x11 --resolution 1280x720 --windowed >/tmp/nightbound-godot.log 2>&1 &
            game_pid=$!
            # Wait for world creation to finish, not merely for the Godot splash screen.
            ready=0
            for attempt in $(seq 1 30); do
              if grep -q "NIGHTBOUND_SCENE_READY" /tmp/nightbound-godot.log; then
                ready=1
                break
              fi
              if ! kill -0 "$game_pid" 2>/dev/null; then
                cat /tmp/nightbound-godot.log
                exit 1
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "Timed out waiting for NIGHTBOUND_SCENE_READY."
              cat /tmp/nightbound-godot.log
              exit 1
            fi
            if grep -E "SCRIPT ERROR:|ERROR: Failed to load script|ERROR: Can.t add child|ERROR: Invalid assignment|ERROR: Parameter" /tmp/nightbound-godot.log; then
              cat /tmp/nightbound-godot.log
              exit 1
            fi
            colors=0
            for attempt in 1 2 3 4 5 6 7 8; do
              import -window root -crop 1280x720+0+0 "$RUNNER_TEMP/Nightbound-gameplay.png"
              colors="$(identify -format "%k" "$RUNNER_TEMP/Nightbound-gameplay.png")"
              if [ "$colors" -ge 32 ]; then
                break
              fi
              echo "Screenshot still blank (attempt $attempt/8); waiting for the 3D scene to render."
              sleep 5
              if ! kill -0 "$game_pid" 2>/dev/null; then
                cat /tmp/nightbound-godot.log
                exit 1
              fi
            done
            identify "$RUNNER_TEMP/Nightbound-gameplay.png"
            mean="$(convert "$RUNNER_TEMP/Nightbound-gameplay.png" -colorspace gray -format "%[fx:mean]" info:)"
            echo "Gameplay screenshot unique colors: $colors; normalized grayscale mean: $mean"
            if [ "$colors" -lt 32 ]; then
              echo "Gameplay screenshot is effectively blank (fewer than 32 unique colors)."
              cat /tmp/nightbound-godot.log
              exit 1
            fi
            awk -v mean="$mean" "BEGIN { if (mean < 0.015) exit 1 }" || {
              echo "Gameplay screenshot is too dark/blank to verify."
              cat /tmp/nightbound-godot.log
              exit 1
            }
            # Keep runtime logs as an artifact so startup errors are diagnosable.
            cp /tmp/nightbound-godot.log "$RUNNER_TEMP/Nightbound-godot.log"
            kill "$game_pid" 2>/dev/null || true
            wait "$game_pid" 2>/dev/null || true
          '
          test -s "$RUNNER_TEMP/Nightbound-gameplay.png"
          test "$(identify -format '%wx%h' "$RUNNER_TEMP/Nightbound-gameplay.png")" = "1280x720"
      - name: Upload gameplay screenshot
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Nightbound-gameplay-screenshot
          path: |
            ${{ runner.temp }}/Nightbound-gameplay.png
            ${{ runner.temp }}/Nightbound-godot.log
          if-no-files-found: error
          retention-days: 30
      - name: Package Nightbound source
        if: github.event_name != 'pull_request'
        run: |
          zip -r "$RUNNER_TEMP/Nightbound-main.zip" . \
            -x "./.git/*" "./.godot/*" ".git/*" ".godot/*"
          unzip -l "$RUNNER_TEMP/Nightbound-main.zip"
      - name: Upload Nightbound ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Nightbound-main
          path: ${{ runner.temp }}/Nightbound-main.zip
          if-no-files-found: error
          retention-days: 30
