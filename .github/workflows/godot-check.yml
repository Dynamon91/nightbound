name: Godot project check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  headless-import:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check project files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
      - name: Import and parse project in headless mode
        run: godot --headless --editor --path . --quit
