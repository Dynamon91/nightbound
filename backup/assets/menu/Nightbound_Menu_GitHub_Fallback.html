<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nightbound — Menù prototipo</title><style>
:root{font-family:system-ui,"Trebuchet MS",sans-serif;color:#faf3ff;background:#030820;font-size:16px}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}.scene{position:fixed;inset:-2%;background-image:linear-gradient(90deg,rgba(3,3,26,.78),rgba(5,7,33,.12) 59%),url(https://raw.githubusercontent.com/Dynamon91/nightbound/main/Nightbound_v1_0_preview.png);background-size:cover;background-position:center;animation:floatworld 16s ease-in-out infinite alternate;filter:saturate(1.08)}
@keyframes floatworld{from{transform:scale(1.04) translateX(-.4%)}to{transform:scale(1.085) translateX(.5%)}}
#stars{position:fixed;inset:0;pointer-events:none} .ui{position:relative;z-index:2;height:100%;display:flex;align-items:flex-end;padding:4vh 5vw}
.panel{width:min(430px,90vw);padding:22px;border:1px solid rgba(151,93,255,.7);border-radius:22px;background:linear-gradient(125deg,rgba(2,9,36,.92),rgba(16,10,53,.7));box-shadow:0 0 40px #3b1a8e55;backdrop-filter:blur(9px)}
.kicker{text-transform:uppercase;letter-spacing:.22em;font-size:.7rem;color:#9dceff;margin-bottom:5px}.heading{margin:0 0 3px;font-weight:950;font-size:clamp(2rem,4vw,3rem);line-height:1.05;letter-spacing:.025em;text-shadow:0 2px 20px #9a40ef;color:#eecaff}.sub{margin:0 0 17px;color:#b6d8ff;font-size:.83rem}
.nav{display:grid;gap:9px}.nav button,.action{width:100%;text-align:left;padding:12px 17px;background:linear-gradient(90deg,rgba(12,22,66,.94),rgba(24,16,69,.89));border:1px solid #5871e9;color:#eeeaff;font-weight:800;font-size:1rem;cursor:pointer;border-radius:9px;transition:.18s;box-shadow:inset 0 0 12px #253a9a22}
.nav button:hover,.nav button:focus,.nav button.active,.action:hover,.action:focus{outline:none;border-color:#d9abff;background:linear-gradient(90deg,#6522bc,#4d1d9e);transform:translateX(4px);box-shadow:0 0 22px #af53ff88}
.nav button:disabled{opacity:.42;cursor:not-allowed;transform:none}.nav button small{float:right;font-size:.74rem;font-weight:500;color:#affeff}
.footer{font-size:.72rem;color:#b8bfea;line-height:1.7;margin:14px 0 0}.overlay{position:fixed;z-index:8;inset:0;background:#020616b9;display:none;align-items:center;justify-content:center;padding:15px}.overlay.open{display:flex}.dialog{background:linear-gradient(160deg,#101a4a,#150834);border:1px solid #af71ff;box-shadow:0 0 70px #291b8e;width:min(500px,96vw);max-height:90vh;overflow:auto;border-radius:18px;padding:26px}.dialog h2{margin:0 0 12px;color:#d6b8ff}.dialog p{color:#c8d5f4}.dialog button{margin:5px 0}.dialog .close{float:right;background:transparent;border:0;color:white;font-size:1.5rem;cursor:pointer}.slot{padding:12px;background:#0c1641;border:1px solid #505da9;border-radius:8px;margin:8px 0}.slot strong{display:block;margin-bottom:4px}.slot span{color:#9dc3e8;font-size:.83rem}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;text-align:center}.note{font-size:.78rem;color:#9fb8dc}.notice{color:#b7efff;font-weight:bold;min-height:1.2em}input{accent-color:#b051ff}label{display:block;margin:12px 0}
@media(max-height:750px){.ui{padding:2vh 3vw}.panel{padding:15px}.nav{gap:5px}.nav button{padding:8px 11px}.sub{margin-bottom:8px}}@media(max-width:600px){.scene{background-position:57% center}.ui{justify-content:center;align-items:flex-end}.panel{width:min(430px,96vw)}.heading{font-size:2rem}}
</style></head><body><div class="scene" aria-hidden="true"></div><canvas id="stars" aria-hidden="true"></canvas>
<main class="ui"><section class="panel"><div class="kicker">✦ Un'avventura sotto la luna ✦</div><h1 class="heading">NIGHTBOUND</h1><p class="sub">Una grande avventura 3D tra isole sospese e cristalli</p><nav class="nav" id="nav">
<button id="continue" data-action="continue">✦ &nbsp; Continua <small id="savehint">Nessun salvataggio</small></button>
<button data-action="new">▶ &nbsp; Nuova partita</button><button data-action="load">▣ &nbsp; Carica</button><button data-action="settings">⚙ &nbsp; Opzioni</button><button data-action="extras">✧ &nbsp; Extra</button><button data-action="exit">↪ &nbsp; Esci</button></nav>
<p class="footer">↑ ↓ naviga · Invio conferma · Esc indietro <span style="display:block">Prototype V1 · HTML autonomo · Non collegato al gioco Godot</span></p></section></main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><div class="dialog"><button class="close" id="close" aria-label="Chiudi">×</button><h2 id="dialogtitle"></h2><div id="dialogbody"></div><p class="notice" id="notice"></p></div></div>
<script>
(()=>{'use strict'; const nav=[...document.querySelectorAll('#nav button')], overlay=document.querySelector('#overlay'), body=document.querySelector('#dialogbody'), title=document.querySelector('#dialogtitle'),notice=document.querySelector('#notice');
const key='nightbound_demo_save_v1'; let saves=[]; try{saves=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(saves))saves=[]}catch(e){saves=[]}
let selection=0;function update(){document.querySelector('#continue').disabled=saves.length===0;document.querySelector('#savehint').textContent=saves.length?'Demo · '+saves[0].area:'Nessun salvataggio';nav.forEach((b,i)=>b.classList.toggle('active',i===selection));}function save(){localStorage.setItem(key,JSON.stringify(saves));update()}
function open(h,markup){title.textContent=h;body.innerHTML=markup;notice.textContent='';overlay.classList.add('open');document.querySelector('#close').focus()}
function close(){overlay.classList.remove('open');nav[selection].focus()}
function demoStart(slot){let stamp=new Date().toLocaleDateString('it-IT');saves=[{slot,area:'Moonlit Valley',date:stamp,crystals:0},...saves.filter(x=>x.slot!==slot)];save();open('Moonlit Valley — Prototipo','<p>Il salvataggio dimostrativo è stato creato nello slot '+slot+'.</p><p>La scena 3D di gioco non è ancora collegata a questo prototipo web.</p><button class="action" data-do="back">Torna al menù</button>')}
function act(a){if(a==='new'){open('Nuova partita','<p>Seleziona uno slot dimostrativo. Verrà salvato solo nel tuo browser.</p><div class="row"><button class="action" data-do="start1">Slot 1</button><button class="action" data-do="start2">Slot 2</button><button class="action" data-do="start3">Slot 3</button></div>')}
else if(a==='load'){open('Carica partita',saves.length?saves.map(s=>'<div class="slot"><strong>Slot '+s.slot+' · '+s.area+'</strong><span>'+s.date+' · '+s.crystals+' cristalli (demo)</span><div class="row"><button class="action" data-do="resume'+s.slot+'">Apri</button><button class="action" data-do="delete'+s.slot+'">Elimina</button></div></div>').join(''):'<p>Non ci sono slot dimostrativi salvati.</p>')}
else if(a==='continue'){if(saves.length)resume(saves[0].slot)}
else if(a==='settings'){let reduced=localStorage.getItem('nb_reduce')==='1';open('Opzioni','<label>Volume effetti (anteprima UI, nessun audio incluso) <input id="vol" type="range" min="0" max="100" value="'+(localStorage.getItem('nb_volume')||'70')+'" style="width:100%"></label><label><input id="reduce" type="checkbox" '+(reduced?'checked':'')+'> Riduci animazioni</label><p class="note">Queste preferenze sono locali al prototipo e non modificano le impostazioni Godot.</p><button class="action" data-do="apply">Salva preferenze</button>')}
else if(a==='extras'){open('Extra','<p>✦ Isole sospese, grotte di cristallo, foreste magiche e castelli in rovina.</p><p>Personaggi pianificati: Hero Bat, Lira, nemici cristallini e Guardiani delle Rovine.</p><p class="note">Questa schermata è una demo UI, non una prova del gameplay.</p>')}
else if(a==='exit'){open('Esci','<p>Questa è una pagina HTML autonoma. Puoi chiudere la scheda per uscire.</p><button class="action" data-do="back">Torna al menù</button>')}
}
function resume(slot){open('Continua — Slot '+slot,'<p>Slot trovato. Il prototipo del menù funziona, ma il livello non è ancora integrato.</p><button class="action" data-do="back">Torna al menù</button>')}
nav.forEach((b,i)=>{b.addEventListener('mouseenter',()=>{selection=i;update()});b.addEventListener('click',()=>{selection=i;update();act(b.dataset.action)})});
body.addEventListener('click',e=>{let a=e.target.closest('[data-do]');if(!a)return;let d=a.dataset.do;if(d==='back')close();else if(d.startsWith('start'))demoStart(Number(d.slice(5)));else if(d.startsWith('resume'))resume(Number(d.slice(6)));else if(d.startsWith('delete')){saves=saves.filter(x=>x.slot!==Number(d.slice(6)));save();act('load')}else if(d==='apply'){localStorage.setItem('nb_volume',document.querySelector('#vol').value);localStorage.setItem('nb_reduce',document.querySelector('#reduce').checked?'1':'0');notice.textContent='Preferenze salvate';applyReduced()}});
document.querySelector('#close').addEventListener('click',close);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(overlay.classList.contains('open')){if(e.key==='Escape')close();return}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();selection=(selection+(e.key==='ArrowDown'?1:-1)+nav.length)%nav.length;update();nav[selection].focus()}else if(e.key==='Enter'||e.key===' '){if(document.activeElement===document.body){e.preventDefault();nav[selection].click()}}});update();
const canvas=document.querySelector('#stars'),ctx=canvas.getContext('2d');let w=0,h=0,stop=false,particles=Array.from({length:56},(_,i)=>({x:(i*137.5%100)/100,y:(i*71.4%100)/100,r:1+(i%4)*.4,sp:.08+(i%6)*.035,a:.25+(i%5)*.11}));function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight}window.addEventListener('resize',resize);resize();function applyReduced(){stop=localStorage.getItem('nb_reduce')==='1';document.querySelector('.scene').style.animationPlayState=stop?'paused':'running';if(stop)ctx.clearRect(0,0,w,h)}applyReduced();let last=0;function draw(time){if(!stop&&time-last>25){last=time;ctx.clearRect(0,0,w,h);for(let p of particles){p.y-=p.sp/4000;if(p.y<0)p.y+=1;let alpha=p.a*(.7+.3*Math.sin(time/800+p.x*70));ctx.fillStyle='rgba(208,160,255,'+alpha+')';ctx.beginPath();ctx.arc(p.x*w,p.y*h,p.r,0,Math.PI*2);ctx.fill()}}requestAnimationFrame(draw)}requestAnimationFrame(draw);
})();
</script></body></html>
